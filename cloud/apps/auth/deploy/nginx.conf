upstream orca_auth {
    server auth:8080;
}

upstream orca_relay {
    server relay:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 网关反代入口：网关用自己的泛域名证书终结 TLS 后，把流量转到这里（纯 HTTP）。
server {
    listen 18080;
    # 域名可改；cell 与 director 同源或不同源都可以，但 cell 的域名必须在网关证书覆盖范围内。
    server_name orca.ctjt.cn c1.ctjt.cn;

    client_max_body_size 1m;

    include /etc/nginx/conf.d/routing.inc;
}
