# Orca Cloud 自建栈：账号服务 + relay + 路径分流边缘。
#
# 用法（在本目录）：
#   cp .env.example .env   # 填入密钥，绝不提交 .env
#   docker compose --env-file .env up -d
#
# 宿主机的 80/443 不被本栈占用：TLS 由公网网关终结，网关把流量反代到 EDGE_INTERNAL_PORT。
services:
  auth:
    image: orca-cloud-auth:local
    restart: unless-stopped
    environment:
      PORT: '8080'
      # 同时充当 JWT issuer；relay 侧的 ORCA_RELAY_AUTH_ISSUER 必须与它逐字相等
      ORCA_AUTH_PUBLIC_URL: ${ORCA_AUTH_PUBLIC_URL:?required}
      ORCA_AUTH_DATA_DIR: /data/auth
      ORCA_AUTH_BOOTSTRAP_USER_EMAIL: ${ORCA_AUTH_BOOTSTRAP_USER_EMAIL:?required}
      # 留空即走 SQLite（单机够用）；填 postgres:// 即走 PostgreSQL
      ORCA_AUTH_DATABASE_URL: ${ORCA_AUTH_DATABASE_URL:-}
      ORCA_AUTH_SESSION_COOKIE_SECRET: ${ORCA_AUTH_SESSION_COOKIE_SECRET:?required}
      ORCA_AUTH_ACCESS_TOKEN_TTL_MS: '900000'
      ORCA_AUTH_REFRESH_TOKEN_TTL_MS: '2592000000'
      ORCA_AUTH_RELAY_TOKEN_TTL_MS: '300000'
      ORCA_AUTH_REFRESH_ROTATION_GRACE_MS: '60000'
      ORCA_AUTH_CAPABILITY_FLAGS: '{"relay.use":true}'
    volumes:
      # 签名私钥与 session 密钥都在这里：容器重建不能丢，否则 relay 缓存的 JWKS 会失配
      - ./data/auth:/data/auth
    expose:
      - '8080'

  relay:
    image: orca-cloud-relay:local
    restart: unless-stopped
    environment:
      PORT: '8080'
      ORCA_RELAY_ROLE: combined
      ORCA_RELAY_CELL_ID: combined
      ORCA_RELAY_REGION: ${ORCA_RELAY_REGION:-us-central1}
      ORCA_RELAY_PUBLIC_URL: ${ORCA_RELAY_PUBLIC_URL:?required}
      ORCA_RELAY_CELL_URL: ${ORCA_RELAY_CELL_URL:?required}
      # issuer 是签发方声明的身份；JWKS 地址可以走内网 http，两者不必同源
      ORCA_RELAY_AUTH_ISSUER: ${ORCA_RELAY_AUTH_ISSUER:?required}
      ORCA_RELAY_AUTH_AUDIENCE: orca-relay
      ORCA_RELAY_JWKS_URL: 'http://auth:8080/.well-known/jwks.json'
      ORCA_RELAY_ASSIGNMENT_SIGNING_KEY: ${ORCA_RELAY_ASSIGNMENT_SIGNING_KEY:?required}
      ORCA_RELAY_ADMIN_AUDIENCE: ${ORCA_RELAY_ADMIN_AUDIENCE:?required}
      ORCA_RELAY_DEPLOY_SERVICE_ACCOUNT: ${ORCA_RELAY_DEPLOY_SERVICE_ACCOUNT:?required}
      ORCA_RELAY_RUNTIME_SERVICE_ACCOUNT: ${ORCA_RELAY_RUNTIME_SERVICE_ACCOUNT:?required}
      ORCA_RELAY_DATA_DIR: /data/relay
      ORCA_RELAY_PUBLIC_ASSIGNMENTS_ENABLED: 'true'
    volumes:
      - ./data/relay:/data/relay
    expose:
      - '8080'

  edge:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      # 网关反代入口：TLS 由网关的 *.ctjt.cn 泛域名证书终结，流量转到这个纯 HTTP 端口
      - '${EDGE_INTERNAL_PORT:-18080}:18080'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./routing.inc:/etc/nginx/conf.d/routing.inc:ro
    depends_on:
      - auth
      - relay
